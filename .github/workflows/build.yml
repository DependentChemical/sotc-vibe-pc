name: Build Shadow of the Colossus PC Port

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VSROOT: C:\Program Files\Microsoft Visual Studio\2022\Community
      SOTC_ISO: ${{ github.workspace }}\Game\SOTC.iso
      PS2X_VU1_TIMING: 0
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download ISO from archive.org
      shell: bash
      run: |
        mkdir -p Game
        curl -L -o Game/SOTC.iso "https://archive.org/download/shadow-of-the-colossus-box/SHADOW_COLOSSUS%20%28PAL%29.iso"

    - name: Verify ISO hash
      shell: pwsh
      run: |
        $hash = (Get-FileHash -Algorithm SHA256 Game/SOTC.iso).Hash
        if ($hash -ne "068925770645266189005f09c9a9a1fee25726bfc93c89b12f832f3673664ac4") {
          Write-Error "ISO hash mismatch"
          exit 1
        }

    - name: Setup VS Environment (find via vswhere)
      shell: pwsh
      run: |
        $vsPath = (& "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath -prerelease | Select-Object -First 1).Trim()
        if (-not $vsPath) { $vsPath = "C:\Program Files\Microsoft Visual Studio\18\Community" }
        $env:VSROOT = $vsPath
        $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
        if (Test-Path $vcvars) {
          echo "Found VS at $vsPath"
        } else {
          Write-Host "Warning: $vcvars not found; will rely on actions preinstalled VS"
        }
        # Write env for following steps
        "VSROOT=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Create temporary generated files (for configure)
      shell: pwsh
      run: |
        New-Item -Path "Port/generated/register_functions.cpp" -ItemType File -Force | Out-Null
        New-Item -Path "Port/generated/sotc_layout_generated.h" -ItemType File -Force | Out-Null
        Write-Host "Dummy files created"

    - name: Configure
      shell: cmd
      run: configure.bat

    - name: Build ps2_recomp
      shell: cmd
      run: build.bat ps2_recomp

    - name: Generate Game Code
      shell: cmd
      run: Tools\generate.bat

    - name: Build Port
      shell: cmd
      run: build.bat

    - name: Package build into 500MB split zip files
      shell: pwsh
      run: |
        $binDir = "build/port/bin"
        $files = Get-ChildItem -LiteralPath $binDir
        $partSize = 500MB
        $partIndex = 1
        $currentSize = 0
        $currentFiles = @()
        foreach ($f in $files) {
          $currentFiles += $f.FullName
          $currentSize += $f.Length
          if ($currentSize -ge $partSize) {
            $zipName = ("sotc_build_part_{0:D2}.zip" -f $partIndex)
            Compress-Archive -Path $currentFiles -DestinationPath $zipName
            Write-Host "Created $zipName ($currentSize bytes)"
            $currentFiles = @()
            $currentSize = 0
            $partIndex++
          }
        }
        if ($currentFiles.Count -gt 0) {
          $zipName = ("sotc_build_part_{0:D2}.zip" -f $partIndex)
          Compress-Archive -Path $currentFiles -DestinationPath $zipName
          Write-Host "Created $zipName ($currentSize bytes)"
        }

    - name: Upload split zip artifacts 01-05 individually
      uses: actions/upload-artifact@v4
      with:
        name: sotc_build_part_01
        path: sotc_build_part_01.zip
        retention-days: 7
        if-no-files-found: ignore
      if: always()

    - name: Upload split zip artifact 02
      uses: actions/upload-artifact@v4
      with:
        name: sotc_build_part_02
        path: sotc_build_part_02.zip
        retention-days: 7
        if-no-files-found: ignore
      if: always()

    - name: Upload split zip artifact 03
      uses: actions/upload-artifact@v4
      with:
        name: sotc_build_part_03
        path: sotc_build_part_03.zip
        retention-days: 7
        if-no-files-found: ignore
      if: always()

    - name: Upload split zip artifact 04
      uses: actions/upload-artifact@v4
      with:
        name: sotc_build_part_04
        path: sotc_build_part_04.zip
        retention-days: 7
        if-no-files-found: ignore
      if: always()

    - name: Upload split zip artifact 05
      uses: actions/upload-artifact@v4
      with:
        name: sotc_build_part_05
        path: sotc_build_part_05.zip
        retention-days: 7
        if-no-files-found: ignore
      if: always()

    - name: Upload remaining split zip artifacts (catch-all)
      uses: actions/upload-artifact@v4
      with:
        name: sotc_build_remaining
        path: sotc_build_part_*.zip
        retention-days: 7
        if-no-files-found: ignore
      if: always()
